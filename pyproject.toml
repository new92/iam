[build-system]
requires = ["setuptools>=70", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "iam-account-manager"
version = "1.0.0"
description = "Privacy-conscious, human-directed Instagram account manager"
readme = "README.md"
requires-python = ">=3.10"
authors = [{name="new92"}]
license = {text="MIT"}
dependencies = ["instagrapi>=2.6.9,<4.0"]
keywords = ["instagram", "account-management", "cli"]
classifiers = ["Programming Language :: Python :: 3", "Environment :: Console", "License :: OSI Approved :: MIT License"]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=5,<8", "ruff>=0.8"]

[project.scripts]
iam = "iam.cli:main"

[tool.setuptools.packages.find]
include = ["iam*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
target-version = "py310"
line-length = 110
exclude = [".venv", "build"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "B"]
ignore = ["E701", "E702"]
